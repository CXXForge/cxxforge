name: Bug report
description: Report a reproducible defect in CXXForge.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve CXXForge. Please do not include secrets or private information."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CXXForge version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, compiler/toolchain, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Redact tokens, credentials, and personal data before sharing.
